<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search Application</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="container">
        <h1>Movie Search Application</h1>
        <form id="search-form">
            <input type="text" id="search-input" placeholder="Search for a movie..." required>
            <button type="submit">Search</button>
        </form>
        <div id="movie-list"></div>
        <div id="movie-details" style="display: none;">
            <button id="back-button">Back to Search</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
